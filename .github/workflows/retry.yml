name: retry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0,1,2,3,4,5,6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r experiment/requirements.txt
      - name: raise budgets for censored cases
        run: |
          python - <<'PY'
import json
p="experiment/h_sensitivity_config.json"
d=json.load(open(p))
d["timeout_seconds_per_analysis"]=900
d["threshold_case_timeout_seconds"]=36000
json.dump(d,open(p,"w"),indent=2)
print("budgets:", d["timeout_seconds_per_analysis"], d["threshold_case_timeout_seconds"])
PY
      - env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p results
          S=$(printf "%03d" ${{ matrix.shard }})
          python experiment/run_threshold.py --cohort cohorts/retry/shard_$S.csv --output results/retry_$S.csv --workers 4 --baseline-verdict AMB
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
