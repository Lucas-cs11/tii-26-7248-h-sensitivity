name: smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r experiment/requirements.txt
      - run: |
          mkdir -p results
          python experiment/make_smoke.py 5
          python experiment/run_threshold.py --cohort cohorts/smoke.csv --output results/smoke.csv --workers 4 --baseline-verdict AMB
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/
