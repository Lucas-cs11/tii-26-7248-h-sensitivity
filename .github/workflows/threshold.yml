name: threshold
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = first 5 cases of shard 000; full = all 40 shards"
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          if [ "${{ inputs.mode }}" = "smoke" ]; then echo 'matrix=[0]' >> "$GITHUB_OUTPUT"; else
          M=$(python3 -c 'import json;print(json.dumps([s["shard"] for s in json.load(open("cohorts/index.json"))["shards"]]))'); echo "matrix=$M" >> "$GITHUB_OUTPUT"; fi
  run:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 359
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiment/requirements.txt
      - name: run shard
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          S=$(printf "%03d" "${{ matrix.shard }}")
          mkdir -p results
          if [ "${{ inputs.mode }}" = "smoke" ]; then
            python - <<PY
import csv
rows=list(csv.DictReader(open("cohorts/shard_000.csv")))
with open("cohorts/smoke.csv","w",newline="") as f:
    w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows[:5])
PY
            COH=cohorts/smoke.csv; OUT=results/smoke.csv
          else
            COH=cohorts/shard_$S.csv; OUT=results/shard_$S.csv
          fi
          echo "cohort=$COH"
          python experiment/run_threshold.py --cohort "$COH" --output "$OUT" --workers 4 --baseline-verdict AMB
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
