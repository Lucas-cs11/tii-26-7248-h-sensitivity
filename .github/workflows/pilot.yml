name: pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r experiment/requirements.txt
      - env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p results
          /usr/bin/time -p python experiment/run_complete_analysis.py --cohort cohorts/complete/pilot40.csv --output results/pilot40.csv --workers 4 || python experiment/run_complete_analysis.py --cohort cohorts/complete/pilot40.csv --output results/pilot40.csv --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot40-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
